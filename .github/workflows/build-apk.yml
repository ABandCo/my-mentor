# Builds the My Mentor Android APK on GitHub (no Expo or Firebase account). The finished file is attached to the run as
# the download "My-Mentor-APK". Nothing is published on a public page.
# Runs when app code on the working branch changes, or by hand: Actions -> Build Android APK -> Run workflow.
name: Build Android APK
on:
  push:
    branches: [claude/intelligent-shannon-d5ge7d]
    paths: ['source/my-mentor/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source/my-mentor
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://soueweipaljxbpupiqed.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_3QHNd8datfSwJMMw-IiZpg_YcC8CgRc
      MM_TARGET_SDK: '34'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/my-mentor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - name: Create the Android project
        run: npx expo prebuild --platform android --clean --no-install

      # The signing key lives only in GitHub's private build cache (never in the repo). Same key = the app can update in place.
      - name: Restore the signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mm-signing
          key: mm-signing-v2
      - name: Create a signing key (first build only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/mm-signing"
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          echo "$PASS" > "$RUNNER_TEMP/mm-signing/pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mm-signing/release.keystore" -storetype PKCS12 -alias mymentor \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=My Mentor, O=Arpan Bohra and Co, C=IN"
      - name: Use the signing key
        run: |
          echo "MM_KEYSTORE=$RUNNER_TEMP/mm-signing/release.keystore" >> "$GITHUB_ENV"
          PASS=$(cat "$RUNNER_TEMP/mm-signing/pass")
          echo "::add-mask::$PASS"
          echo "MM_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MM_KEY_ALIAS=mymentor" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: source/my-mentor/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      # Some phone installers (seen on a OnePlus) reject an APK signed with the newer v2 scheme only. Android's build tools
      # drop the older v1 signature automatically, so we align the file and sign it again with v1 + v2, using the same key.
      - name: Align and sign again (v1 + v2)
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out
          $BT/zipalign -P 16 -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign --ks "$MM_KEYSTORE" --ks-pass env:MM_KEYSTORE_PASSWORD --ks-key-alias "$MM_KEY_ALIAS" --key-pass env:MM_KEYSTORE_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --min-sdk-version 21 \
            --out out/My-Mentor.apk "$RUNNER_TEMP/aligned.apk"
      - name: Check the file
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          ls -l out
          $BT/zipalign -c -v -P 16 4 out/My-Mentor.apk | tail -3
          echo "--- native libraries (should be Stored, i.e. uncompressed) ---"
          unzip -v out/My-Mentor.apk | grep -E "\.so$" | head -6
          echo "--- manifest flags ---"
          $BT/aapt2 dump xmltree --file AndroidManifest.xml out/My-Mentor.apk | grep -E "extractNativeLibs|minSdkVersion|targetSdkVersion|debuggable|usesCleartext|compileSdk" | head -8
          $BT/apksigner verify --verbose out/My-Mentor.apk | head -8
          $BT/aapt2 dump badging out/My-Mentor.apk | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code|^compileSdk" | head -6
          unzip -tq out/My-Mentor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: My-Mentor-APK
          path: source/my-mentor/out/My-Mentor.apk
          retention-days: 30
